<html>
  <head></head>
  <body>
    <!--
      Netlify detects forms by parsing static HTML at deploy time. Next.js does
      not emit a fully-static page for the App Router route that holds the real
      form, so this file declares the schema instead. The React form in
      src/components/ContactForm.tsx POSTs here as urlencoded data.
      Every field the client sends must be declared below or it is dropped.
      Docs: https://opennext.js.org/netlify/forms
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" type="text" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="subject" type="text" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
