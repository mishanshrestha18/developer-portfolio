# Netlify's Next.js Runtime (OpenNext adapter) is installed automatically on
# every build and supports Next.js 13.5+. Deliberately not pinned via a
# [[plugins]] entry — Netlify recommends letting it track the latest version.

# No `publish` key on purpose: the Next.js adapter sets its own publish
# directory. Pointing it at ".next" makes Netlify serve the raw build folder
# as static files, which 404s on every route.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
